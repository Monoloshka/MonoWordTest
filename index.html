<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MonoWordTest</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f3ee; color: #141413; }
  #app { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-height: 100%; box-sizing: border-box; padding: 12px; }
  .hidden { display: none !important; }
  .screen { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-height: 0; }

  /* top bar: language + theme, always ONE row (labels disappear on narrow screens) */
  #topbar { display: -webkit-flex; display: flex; -webkit-flex-wrap: nowrap; flex-wrap: nowrap; -webkit-justify-content: flex-end; justify-content: flex-end; font-size: 14px; }
  #topbar > div { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-width: 0; margin: 0 0 6px 10px; }
  #topbar label { white-space: nowrap; margin-right: 4px; }
  #topbar select { min-width: 0; max-width: 100%; padding: 4px; text-overflow: ellipsis; }
  #langImportBtn { margin: 0 0 0 4px; padding: 2px 9px; font-weight: bold; }

  /* menu */
  #menu { -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 34px; color: #d97757; }
  .sub { margin: 0 0 18px; color: #6b6a63; max-width: 560px; }
  .row, .setting { margin: 8px 0; }
  .setting { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; }
  .setting > * { margin: 2px 6px; }
  .btn, button { display: inline-block; box-sizing: border-box; margin: 4px; font: inherit; line-height: 1.3; cursor: pointer; border: 1px solid #c9c6b8; background: #fff; color: #141413; padding: 10px 18px; border-radius: 6px; }
  .btn:hover, button:hover { background: #f0eee6; }
  .primary { background: #d97757; border-color: #c4623f; color: #fff; }
  .primary:hover { background: #c4623f; }
  .primary[disabled] { background: #e7c3b4; border-color: #e7c3b4; cursor: default; }
  .file-input { position: absolute; left: -9999px; }
  label { margin-right: 6px; }
  .chk { cursor: pointer; }
  select, input[type=number] { font: inherit; padding: 6px; background: #fff; color: #141413; border: 1px solid #c9c6b8; border-radius: 6px; }
  input[type=number] { width: 4.5em; }
  #fileName, #message, .hint { color: #6b6a63; font-size: 14px; word-wrap: break-word; max-width: 560px; }
  .hint { font-size: 12px; margin: 4px 0; }
  #message.error { color: #b3261e; }

  /* about */
  #about { -webkit-align-items: center; align-items: center; -webkit-justify-content: flex-start; justify-content: flex-start; text-align: center; overflow-y: auto; }
  #aboutIcon { margin-top: auto; width: 128px; height: 128px; }
  #about > .row:last-child { margin-bottom: auto; }
  #aboutVersion { margin-top: 8px; font-weight: bold; }
  #aboutAuthor { margin: 4px 0 14px; color: #6b6a63; }
  #aboutLinks { margin: 0 0 12px; padding: 0 8px; text-align: left; max-width: 100%; }
  #aboutLinks ul { list-style: none; margin: 0; padding: 0; }
  #aboutLinks li { margin: 8px 0; word-wrap: break-word; }
  #aboutLinks a, .linklike { color: #c4623f; }
  #aboutLinks details { margin: 12px 0; }
  #aboutLinks summary { cursor: pointer; font-weight: bold; }
  #aboutLinks details > ul { margin-top: 6px; }
  .linklike { background: none; border: 0; padding: 0; margin: 0; font: inherit; text-decoration: underline; cursor: pointer; text-align: left; }
  .aboutNote { color: #6b6a63; font-size: 13px; }
  .siteIcon { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; border: 0; }

  /* game */
  #board { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; min-height: 0; }
  #questionBox { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 16px; min-width: 0; }
  #question { font-size: 40px; font-weight: bold; text-align: center; word-wrap: break-word; max-width: 100%; }
  #qImg { max-width: 100%; max-height: 45vh; }
  #answers { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; overflow-y: auto; padding: 8px; }
  .ans { display: block; width: 100%; margin: 4px 0; padding: 12px 14px; font-size: 20px; text-align: left; word-wrap: break-word; min-height: 48px; }
  .ans.wrong { background: #d9534f; border-color: #b52b27; color: #fff; }
  .ans.right { background: #3c9d4a; border-color: #2b7a37; color: #fff; }
  #statusbar { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 8px 4px; }
  #status, #scoreText { color: #6b6a63; margin-right: 12px; }

  /* ad: start screen only, bottom centre, in the page flow */
  #adBox { text-align: center; padding: 10px 0 4px; }
  #adLabel { font-size: 11px; color: #8a897f; margin-bottom: 2px; }
  #adLink { display: inline-block; max-width: 100%; -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
  #adLink.img { line-height: 0; }
  #adImg { max-width: 100%; max-height: 120px; height: auto; border: 0; -webkit-user-drag: none; }
  #adText { color: #c4623f; text-decoration: underline; font-size: 15px; }

  #toast { position: fixed; left: 50%; bottom: 70px; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: #141413; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 20; }
  #ctxMenu { position: fixed; z-index: 30; background: #fff; border: 1px solid #c9c6b8; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.25); padding: 2px; }
  #ctxMenu button { display: block; margin: 0; border: 0; background: transparent; padding: 8px 16px; width: 100%; text-align: left; }

  footer { text-align: center; padding-top: 8px; line-height: 0; }
  footer a { display: inline-block; }
  footer svg { border: 0; }

  /* dark theme (plain class, no CSS variables, so old engines still work) */
  body.dark { background: #1f1e1d; color: #f0eee6; }
  body.dark .sub, body.dark #fileName, body.dark #message, body.dark .hint, body.dark #status, body.dark #scoreText, body.dark #aboutAuthor { color: #a8a69c; }
  body.dark #message.error { color: #f2766d; }
  body.dark .btn, body.dark button, body.dark select, body.dark input[type=number] { background: #2b2a28; color: #f0eee6; border-color: #4a4843; }
  body.dark .btn:hover, body.dark button:hover { background: #3a3835; }
  body.dark .primary { background: #d97757; border-color: #c4623f; color: #fff; }
  body.dark .primary:hover { background: #c4623f; }
  body.dark .primary[disabled] { background: #5a4338; border-color: #5a4338; color: #bbb; }
  body.dark .ans.wrong { background: #d9534f; border-color: #b52b27; color: #fff; }
  body.dark .ans.right { background: #3c9d4a; border-color: #2b7a37; color: #fff; }
  body.dark #adText, body.dark #aboutLinks a, body.dark .linklike { color: #f0a58a; }
  body.dark .aboutNote { color: #a8a69c; }
  body.dark .siteIcon { background: #f0eee6; border-radius: 4px; padding: 1px; box-sizing: content-box; }
  body.dark #toast { background: #f0eee6; color: #141413; }
  body.dark #ctxMenu { background: #2b2a28; border-color: #4a4843; }
  body.dark #ctxMenu button:hover { background: #3a3835; }

  html.nomouse, html.nomouse * { pointer-events: none !important; -webkit-user-select: none !important; user-select: none !important; }

  /* phones / portrait: question on top, answers below */
  @media (max-width: 700px), (orientation: portrait) {
    #board { -webkit-flex-direction: column; flex-direction: column; }
    #question { font-size: 30px; }
    .ans { font-size: 18px; }
  }
  @media (max-width: 520px) {
    #topbar label { display: none; }
    #topbar > div { margin-left: 6px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div>
      <label for="lang" data-i18n="Language:">Language:</label>
      <select id="lang"><option value="auto" data-i18n="Auto" data-icon="&#127760;">Auto</option></select>
      <label class="btn" id="langImportBtn" for="langFile" data-i18n-title="Import language files…" title="Import language files…">+</label>
      <input type="file" id="langFile" class="file-input" multiple accept=".json,application/json">
    </div>
    <div>
      <label for="theme" data-i18n="Theme:">Theme:</label>
      <select id="theme">
        <option value="auto" data-i18n="Auto" data-icon="&#127763;">Auto</option>
        <option value="light" data-i18n="Light" data-icon="&#9728;&#65039;">Light</option>
        <option value="dark" data-i18n="Dark" data-icon="&#127769;">Dark</option>
      </select>
    </div>
  </div>

  <!-- ===== main menu ===== -->
  <div id="menu" class="screen">
    <h1>MonoWordTest</h1>
    <p class="sub" data-i18n="Guess the translation. Load a .txt file where each line is: word - translation">Guess the translation. Load a .txt file where each line is: word - translation</p>

    <div class="row">
      <label class="btn" for="file" data-i18n="Browse…">Browse&hellip;</label>
      <input type="file" id="file" class="file-input" multiple accept=".txt,.xlsx,.xls,.ods,.png,.jpg,.jpeg,.webp,.gif,.svg,text/plain">
      <label class="btn" for="folder" id="folderBtn" data-i18n="Folder…">Folder&hellip;</label>
      <input type="file" id="folder" class="file-input" multiple webkitdirectory>
      <button type="button" id="builtinBtn" data-i18n="Use built-in RU ↔ EN dictionary">Use built-in RU &#8596; EN dictionary</button>
    </div>
    <div class="hint" data-i18n="Select several files at once: dictionaries (.txt, .xlsx, .xls, .ods) and the pictures they refer to.">Select several files at once: dictionaries (.txt, .xlsx, .xls, .ods) and the pictures they refer to.</div>
    <div class="row" id="fileName">No file selected</div>

    <div class="setting">
      <label for="count" data-i18n="Answer options:">Answer options:</label>
      <select id="count">
        <option>2</option><option>3</option><option selected>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
    </div>
    <div class="setting">
      <label for="dir" data-i18n="Show:">Show:</label>
      <select id="dir">
        <option value="rand" selected data-i18n="Random side">Random side</option>
        <option value="ab" data-i18n='Left of " - " (guess the right)'>Left of " - " (guess the right)</option>
        <option value="ba" data-i18n='Right of " - " (guess the left)'>Right of " - " (guess the left)</option>
      </select>
    </div>
    <div class="setting">
      <label for="nextMode" data-i18n="Next question:">Next question:</label>
      <select id="nextMode">
        <option value="auto" selected data-i18n="Automatically">Automatically</option>
        <option value="manual" data-i18n="By button">By button</option>
      </select>
      <span id="delayWrap">
        <label for="delay" data-i18n="Delay, seconds:">Delay, seconds:</label>
        <input type="number" id="delay" min="1" max="60" step="1" value="5">
      </span>
    </div>
    <div class="setting">
      <label class="chk"><input type="checkbox" id="scoreOpt"> <span data-i18n="Count correct and wrong answers">Count correct and wrong answers</span></label>
    </div>
    <div class="setting" id="soundRow">
      <label class="chk"><input type="checkbox" id="soundOpt" checked> <span data-i18n="Sound">Sound</span></label>
    </div>

    <div class="row">
      <button type="button" id="startBtn" class="primary" disabled data-i18n="Start">Start</button>
      <button type="button" id="aboutBtn" data-i18n="About">About</button>
      <button type="button" id="exitBtn" class="hidden" data-i18n="Exit">Exit</button>
    </div>
    <div class="row" id="message"></div>
  </div>

  <!-- ===== about ===== -->
  <div id="about" class="screen hidden">
    <img id="aboutIcon" class="hidden" alt="" draggable="false">
    <div id="aboutVersion"></div>
    <div id="aboutAuthor"></div>
    <div id="aboutLinks"></div>
    <div class="row"><button type="button" id="backBtn" data-i18n="Back">Back</button></div>
  </div>

  <!-- ===== game ===== -->
  <div id="game" class="screen hidden">
    <div id="board">
      <div id="questionBox"><div id="question"></div><img id="qImg" class="hidden" alt=""></div>
      <div id="answers"></div>
    </div>
    <div id="statusbar">
      <span><span id="status"></span><span id="scoreText"></span></span>
      <span>
        <button type="button" id="nextBtn" class="primary hidden" data-i18n="Next">Next</button>
        <button type="button" id="toMenuBtn" data-i18n="To menu">To menu</button>
      </span>
    </div>
  </div>

  <!-- Embedded ad (start screen only). Content comes from ads.js, baked into the app. -->
  <div id="adBox" class="hidden">
    <div id="adLabel"></div>
    <a id="adLink" href="#" target="_blank" rel="noopener noreferrer" draggable="false"><img id="adImg" alt="" draggable="false"><span id="adText"></span></a>
  </div>

  <footer>
    <a href="https://claude.com/product/overview" target="_blank" rel="noopener noreferrer" title="Claude" style="margin:4px">

  var statusState = { key: '', params: null };
  var currentAd = null, lastAd = -1;
  var imgByPath = {}, imgByBase = {}, imgEntries = [];

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function setText(el, t) { if ('textContent' in el) { el.textContent = t; } else { el.innerText = t; } }
  function on(el, ev, fn) { if (el.addEventListener) { el.addEventListener(ev, fn, false); } else if (el.attachEvent) { el.attachEvent('on' + ev, fn); } }
  function hasClass(el, c) { return (' ' + el.className + ' ').indexOf(' ' + c + ' ') >= 0; }
  function addClass(el, c) { if (!hasClass(el, c)) { el.className += (el.className ? ' ' : '') + c; } }
  function delClass(el, c) { el.className = (' ' + el.className + ' ').replace(' ' + c + ' ', ' ').replace(/^\s+|\s+$/g, ''); }
  function randInt(n) { return Math.floor(Math.random() * n); }
  function trim(s) { return s.replace(/^\s+|\s+$/g, ''); }
  function stopEvent(e) { if (e.preventDefault) { e.preventDefault(); } else { e.returnValue = false; } }
  function saveSetting(k, v) { try { window.localStorage.setItem('mwt_' + k, v); } catch (e) { } }
  function loadSetting(k) { try { return window.localStorage.getItem('mwt_' + k); } catch (e) { return null; } }
  function extOf(name) { var m = /\.([A-Za-z0-9]+)$/.exec(name); return m ? m[1].toLowerCase() : ''; }

  /* running as a real app (Electron / NW.js / Capacitor) and not in a browser tab or on a router page? */
  function isStandalone() {
    try {
      if (window.MWT_STANDALONE || window.MWTAndroid) { return true; }
      if (/Electron\//.test(navigator.userAgent)) { return true; }
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) { return true; }
    } catch (e) { }
    return false;
  }

  /* ---------- i18n ----------
     The app contains only English. More languages come from (1) the gettext catalogues of a Flatpak
     (MWT_NATIVE_LANGS, supplied by the Electron wrapper) and (2) .json language files the user imports
     (kept in localStorage). Several entries with the same language code are listed as "Name", "Name (2)", ... */
  var CODE_RE = /^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})*$/;
  function cleanLang(code, L) {
    if (!L || typeof L !== 'object' || !CODE_RE.test(String(code))) { return null; }
    var strings = {}, n = 0, k;
    if (L.strings && typeof L.strings === 'object') {
      for (k in L.strings) {
        if (L.strings.hasOwnProperty(k) && typeof L.strings[k] === 'string' && L.strings[k] !== '' && k.length < 2000 && L.strings[k].length < 2000 && n < 1000) { strings[k] = L.strings[k]; n++; }
      }
    }
    return { code: String(code).replace('_', '-').toLowerCase(), name: String(L.name || code).substring(0, 80), flag: L.flag ? String(L.flag).substring(0, 16) : '', strings: strings };
  }
  function langsFromData(data) {          // {"ru": {...}, "uk": {...}}  or a single {"code": "ru", "name": ..., "strings": ...}
    var out = [], k, e;
    if (!data || typeof data !== 'object') { return out; }
    if (data.strings && typeof data.strings === 'object') { e = cleanLang(data.code, data); if (e) { out.push(e); } return out; }
    var count = 0;
    for (k in data) { if (data.hasOwnProperty(k) && count++ < 200) { e = cleanLang(k, data[k]); if (e) { out.push(e); } } }
    return out;
  }
  function rebuildLangList() {
    var list = [{ code: 'en', name: 'English', flag: '\uD83C\uDDEC\uD83C\uDDE7', strings: {} }], k, i;
    var nat = window.MWT_NATIVE_LANGS;
    if (nat && typeof nat === 'object') {
      for (k in nat) { if (nat.hasOwnProperty(k)) { var ne = cleanLang(k, nat[k]); if (ne) { list.push(ne); } } }
    }
    for (i = 0; i < imported.length; i++) { list.push(imported[i]); }
    for (i = 0; i < sessionLangs.length; i++) { list.push(sessionLangs[i]); }
    var counts = {};
    LANGBY = {};
    for (i = 0; i < list.length; i++) {
      var e = list[i], c = e.code;
      counts[c] = (counts[c] || 0) + 1;
      e.id = counts[c] === 1 ? c : c + '#' + counts[c];
      e.label = (e.flag ? e.flag + ' ' : '') + e.name + (counts[c] > 1 ? ' (' + counts[c] + ')' : '');
      LANGBY[e.id] = e;
    }
    LANGLIST = list;
  }
  function loadImported() {
    imported = [];
    try {
      var raw = JSON.parse(loadSetting('langs') || '[]');
      for (var i = 0; i < raw.length; i++) {
        var r = raw[i], e = (r && typeof r === 'object') ? cleanLang(r.code, r) : null;
        if (e) { imported.push(e); }
      }
    } catch (err) { imported = []; }
  }
  function saveImported() { saveSetting('langs', JSON.stringify(imported)); }
  function detectLang() {
    var list = [];
    try {
      if (navigator.languages && navigator.languages.length) { list = navigator.languages; }
      else { list = [navigator.language || navigator.userLanguage || '']; }
    } catch (e) { }
    for (var i = 0; i < list.length; i++) {
      var tag = String(list[i] || '').toLowerCase().replace('_', '-');
      if (!tag) { continue; }
      var id = findLang(tag) || findLang(tag.split('-')[0]);
      if (id) { return id; }
    }
    return 'en';
  }
  function findLang(tag) {                  // first entry with that code
    for (var i = 0; i < LANGLIST.length; i++) { if (LANGLIST[i].code === tag) { return LANGLIST[i].id; } }
    return null;
  }
  function currentLangId() {
    var pref = $('lang').value;
    if (pref && pref !== 'auto' && pref !== '__remove__' && LANGBY.hasOwnProperty(pref)) { return pref; }
    return detectLang();
  }
  function t(key, params) {
    var s = key, L = LANGBY[langId];
    if (L && L.strings && L.strings.hasOwnProperty(key) && L.strings[key]) { s = L.strings[key]; }
    if (params) {
      for (var p in params) { if (params.hasOwnProperty(p)) { s = s.split('{' + p + '}').join(String(params[p])); } }
    }
    return s;
  }
  function applyLang() {
    langId = currentLangId();
    document.documentElement.lang = LANGBY[langId] ? LANGBY[langId].code : 'en';
    var els = document.querySelectorAll('[data-i18n]'), i;
    for (i = 0; i < els.length; i++) {
      var icon = els[i].getAttribute('data-icon');
      setText(els[i], (icon ? icon + ' ' : '') + t(els[i].getAttribute('data-i18n')));
    }
    els = document.querySelectorAll('[data-i18n-title]');
    for (i = 0; i < els.length; i++) {
      var tt = t(els[i].getAttribute('data-i18n-title'));
      els[i].setAttribute('title', tt); els[i].setAttribute('aria-label', tt);
    }
    renderFile(); renderMessage(); renderStatus(); renderScore(); renderAdText(); renderAbout();
  }
  function buildLangMenu(preferred) {
    var sel = $('lang');
    while (sel.options.length > 1) { sel.remove(1); }
    for (var i = 0; i < LANGLIST.length; i++) {
      var o = document.createElement('option');
      o.value = LANGLIST[i].id;
      setText(o, LANGLIST[i].label);
      sel.appendChild(o);
    }
    if (imported.length) {
      var r = document.createElement('option');
      r.value = '__remove__';
      r.setAttribute('data-i18n', 'Remove imported languages'); r.setAttribute('data-icon', '\uD83D\uDDD1');
      sel.appendChild(r);
    }
    var saved = preferred || loadSetting('lang');
    sel.value = (saved && LANGBY.hasOwnProperty(saved)) ? saved : 'auto';
  }
  function importLangFiles(files) {
    var idx = 0, added = [];
    function next() {
      if (idx >= files.length) { done(); return; }
      var f = files[idx++];
      if (f.size > 2 * 1024 * 1024) { next(); return; }
      var r = new FileReader();
      r.onerror = function () { next(); };
      r.onload = function () {
        try {
          var found = langsFromData(JSON.parse(String(r.result).replace(/^\uFEFF/, '')));
          for (var i = 0; i < found.length; i++) {
            var sig = JSON.stringify([found[i].code, found[i].name, found[i].strings]), dup = false;
            for (var j = 0; j < imported.length; j++) { if (JSON.stringify([imported[j].code, imported[j].name, imported[j].strings]) === sig) { dup = true; break; } }
            if (!dup && imported.length < 300) { imported.push(found[i]); added.push(found[i]); }
          }
        } catch (err) { /* not valid JSON: skipped */ }
        next();
      };
      try { r.readAsText(f, 'UTF-8'); } catch (e) { next(); }
    }
    function done() {
      if (!added.length) { showToast('No usable language data in the selected files.'); return; }
      saveImported();
      rebuildLangList();
      var first = added[0].id;                // the first entry added is selected right away
      saveSetting('lang', first);
      buildLangMenu(first);
      applyLang();
      showToast('Languages added: {n}', { n: added.length });
    }
    if (typeof FileReader === 'undefined') { showToast('No usable language data in the selected files.'); return; }
    next();
  }

  /* dynamic texts that must be re-rendered when the language changes */
  function renderFile() { setText($('fileName'), fileState.raw !== null ? fileState.raw : t(fileState.key, fileState.params)); }
  function setMessage(key, params, isError) { msgState = { key: key, params: params || null, error: !!isError }; renderMessage(); }
  function renderMessage() {
    setText($('message'), msgState.key ? t(msgState.key, msgState.params) : '');
    $('message').className = msgState.error ? 'error' : '';
  }
  function setStatus(key, params) { statusState = { key: key, params: params || null }; renderStatus(); }
  function renderStatus() { setText($('status'), statusState.key ? t(statusState.key, statusState.params) : ''); }

  /* ---------- theme ---------- */
  var mq = null;
  try { mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null; } catch (e) { mq = null; }
  function applyTheme() {
    var pref = $('theme').value;
    var dark = pref === 'dark' || (pref === 'auto' && mq && mq.matches);
    if (dark) { addClass(document.body, 'dark'); } else { delClass(document.body, 'dark'); }
  }

  /* ---------- toast, clipboard ---------- */
  var toastTimer = null;
  function showToast(key, params) {
    var el = $('toast');
    setText(el, t(key, params));
    delClass(el, 'hidden');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { addClass(el, 'hidden'); }, 2000);
  }
  function copyText(text, done) {
    function fallback() {
      var ok = false;
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { ok = false; }
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  /* ---------- sound (mp3 only; several events may share one file) ---------- */
  function playSound(ev) {
    if (!$('soundOpt').checked || !SOUNDS[ev]) { return; }
    try {
      var a = new Audio(SOUNDS[ev]);
      var p = a.play();
      if (p && p.catch) { p.catch(function () { }); }
    } catch (e) { }
  }
  function hasSounds() { for (var k in SOUNDS) { if (SOUNDS.hasOwnProperty(k)) { return true; } } return false; }

  /* ---------- parsing: never throws, silently skips bad lines ---------- */
  function isImageRef(s) {
    if (/^https?:\/\//i.test(s)) { return /\.(png|jpe?g|webp|gif|svg)([?#]|$)/i.test(s); }
    return /\.(png|jpe?g|webp|gif|svg)$/i.test(s);
  }
  function makePair(a, b, dir) {
    if (!a || !b) { return null; }
    var ai = isImageRef(a), bi = isImageRef(b);
    if (ai && bi) { return null; }          // a picture on both sides makes no question
    return { a: a, b: b, ai: ai, bi: bi, dir: dir };
  }
  function parseText(text, dir) {
    var out = [];
    try {
      text = String(text).replace(/^\uFEFF/, '');
      var lines = text.split(/\r\n|\r|\n/);
      for (var i = 0; i < lines.length && out.length < MAX_PAIRS; i++) {
        var line = lines[i];
        var p = line.indexOf(SEPARATOR);
        if (p < 0) { continue; }
        var pr = makePair(trim(line.substring(0, p)), trim(line.substring(p + SEPARATOR.length)), dir);
        if (pr) { out.push(pr); }
      }
    } catch (e) { /* ignore: whatever was parsed so far is kept */ }
    return out;
  }
  function parseWorkbook(wb, dir) {
    var out = [];
    try {
      for (var s = 0; s < wb.SheetNames.length; s++) {
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[s]], { header: 1, defval: '', raw: false });
        for (var r = 0; r < rows.length && out.length < MAX_PAIRS; r++) {
          var row = rows[r] || [];
          var pr = makePair(trim(String(row[0] == null ? '' : row[0])), trim(String(row[1] == null ? '' : row[1])), dir);
          if (pr) { out.push(pr); }
        }
      }
    } catch (e) { }
    return out;
  }

  /* ---------- reading files ---------- */
  function readTextFile(file, cb) {            // UTF-8, falls back to Windows-1251
    var r = new FileReader();
    r.onerror = function () { cb(null); };
    r.onload = function () {
      var txt = r.result;
      if (typeof txt === 'string' && txt.indexOf('\uFFFD') >= 0) {
        var r2 = new FileReader();
        r2.onerror = function () { cb(txt); };
        r2.onload = function () { cb(r2.result); };
        try { r2.readAsText(file, 'windows-1251'); } catch (e) { cb(txt); }
      } else { cb(txt); }
    };
    try { r.readAsText(file, 'UTF-8'); } catch (e) { cb(null); }
  }
  function loadXlsxLib(cb) {                    // loaded only when a spreadsheet is chosen
    if (window.XLSX) { cb(true); return; }
    var head = document.getElementsByTagName('head')[0], s = document.createElement('script');
    var embedded = document.getElementById('mwt-xlsx');      // present in the single-file build (MonoWordTest.html)
    if (embedded) {
      try { s.text = embedded.text || embedded.textContent; head.appendChild(s); } catch (e) { }
      cb(!!window.XLSX);
      return;
    }
    s.onload = function () { cb(!!window.XLSX); };
    s.onerror = function () { cb(false); };
    s.src = 'vendor/xlsx.full.min.js';
    head.appendChild(s);
  }
  function readSpreadsheet(file, dir, cb) {     // cb(pairs | null, errorKey)
    loadXlsxLib(function (ok) {
      if (!ok) { cb(null, 'Spreadsheet support is not available in this build.'); return; }
      var r = new FileReader();
      r.onerror = function () { cb(null, 'Could not read the spreadsheet.'); };
      r.onload = function () {
        try { cb(parseWorkbook(XLSX.read(r.result, { type: 'array' }), dir), null); }
        catch (e) { cb(null, 'Could not read the spreadsheet.'); }
      };
      try { r.readAsArrayBuffer(file); } catch (e) { cb(null, 'Could not read the spreadsheet.'); }
    });
  }

  function dirOf(path) { var i = path.lastIndexOf('/'); return i < 0 ? '' : path.substring(0, i); }
  function normPath(p) {
    var parts = p.replace(/\\/g, '/').split('/'), out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === '' || parts[i] === '.') { continue; }
      if (parts[i] === '..') { out.pop(); continue; }
      out.push(parts[i]);
    }
    return out.join('/');
  }

  function resetImages() {
    for (var i = 0; i < imgEntries.length; i++) {
      try { if (imgEntries[i].url && window.URL && URL.revokeObjectURL) { URL.revokeObjectURL(imgEntries[i].url); } } catch (e) { }
    }
    imgByPath = {}; imgByBase = {}; imgEntries = [];
  }
  /* picture reference -> usable URL. Paths are relative to the folder of the dictionary file;
     if the browser gave no folder information (plain multi-select) the file name alone is matched. */
  function imageURL(ref, dir) {
    if (NOIMAGE) { return null; }
    if (/^https?:\/\//i.test(ref)) { return ref; }
    var full = normPath((dir ? dir + '/' : '') + ref).toLowerCase();
    var e = imgByPath[full];
    if (!e) { e = imgByBase[ref.replace(/\\/g, '/').split('/').pop().toLowerCase()]; }
    if (!e) { return null; }
    if (!e.url) {
      if (!(window.URL && URL.createObjectURL)) { return null; }
      e.url = URL.createObjectURL(e.file);
    }
    return e.url;
  }

  function handleFiles(list) {
    var dicts = [], i;
    resetImages();
    for (i = 0; i < list.length; i++) {
      var f = list[i];
      var path = String(f.webkitRelativePath || f.name).replace(/\\/g, '/');
      var ext = extOf(f.name);
      if (DICT_EXT[ext]) { dicts.push({ file: f, path: path, ext: ext }); }
      else if (IMG_EXT[ext]) {
        var entry = { file: f, url: null };
        imgEntries.push(entry);
        imgByPath[path.toLowerCase()] = entry;
        var base = f.name.toLowerCase();
        if (!imgByBase[base]) { imgByBase[base] = entry; }
      }
    }
    if (typeof FileReader === 'undefined') { finishLoading([], null, 'This browser cannot read files. Use the built-in dictionary.', 0); return; }
    if (!dicts.length) { finishLoading([], null, 'No dictionary file (.txt, .xlsx, .xls, .ods) among the selected files.', 0); return; }

    var all = [], idx = 0, lastError = null;
    function next() {
      if (idx >= dicts.length) { finishLoading(all, dicts, lastError, dicts.length); return; }
      var d = dicts[idx++], dir = dirOf(d.path);
      function got(prs, err) {
        if (prs) { for (var k = 0; k < prs.length && all.length < MAX_PAIRS; k++) { all.push(prs[k]); } }
        if (err) { lastError = err; }
        next();
      }
      if (d.ext === 'txt') { readTextFile(d.file, function (txt) { got(txt === null ? null : parseText(txt, dir), txt === null ? 'Could not read the file.' : null); }); }
      else { readSpreadsheet(d.file, dir, got); }
    }
    next();
  }

  function finishLoading(all, dicts, errKey, count) {
    if (CLI) { console.info('import: ' + all.length + ' entries from ' + count + ' dictionary file(s)' + (errKey ? ' (' + errKey + ')' : '')); }
    if (all.length < 2) {
      pairs = [];
      $('startBtn').disabled = true;
      fileState = { key: 'No file selected', params: null, raw: null };
      renderFile();
      setMessage(errKey || 'No usable lines found. Each line must look like: word - translation (at least 2 lines).', null, true);
      return;
    }
    pairs = all;
    $('startBtn').disabled = false;
    fileState = count === 1 ? { key: '', params: null, raw: dicts[0].file.name } : { key: 'Files selected: {n}', params: { n: count }, raw: null };
    renderFile();
    setMessage('Loaded {n} entries. Choose options and press Start.', { n: pairs.length }, false);
  }

  /* ---------- game ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1), tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function stopTimer() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }
  function delaySeconds() {
    var n = parseInt($('delay').value, 10);
    if (isNaN(n) || n < 1) { n = DEFAULT_DELAY; }
    return n > 60 ? 60 : n;
  }
  function renderScore() {
    var show = $('scoreOpt').checked && !hasClass($('game'), 'hidden');
    setText($('scoreText'), show ? '\u2714 ' + t('Correct: {n}', { n: score.ok }) + '   \u2716 ' + t('Wrong: {n}', { n: score.bad }) : '');
  }

  function showPrompt(text, isImg, dir) {
    var q = $('question'), qi = $('qImg');
    if (isImg) {
      var u = imageURL(text, dir);
      if (u) {
        qi.onerror = function () { addClass(qi, 'hidden'); setText(q, text); delClass(q, 'hidden'); };
        qi.src = u;
        delClass(qi, 'hidden'); addClass(q, 'hidden');
        return;
      }
    }
    qi.onerror = null;
    addClass(qi, 'hidden');
    setText(q, text); delClass(q, 'hidden');
  }

  function newRound() {
    stopTimer();
    locked = false;
    addClass($('nextBtn'), 'hidden');
    var wanted = parseInt($('count').value, 10) || 4;
    var dir = $('dir').value;
    var idx = randInt(pairs.length), P = pairs[idx];
    var flip = (dir === 'ba') ? true : (dir === 'ab') ? false : (Math.random() < 0.5);
    if (flip ? P.ai : P.bi) { flip = !flip; }       // a picture is always the question, never an answer
    var prompt = flip ? P.b : P.a;
    var correct = flip ? P.a : P.b;
    var promptIsImg = flip ? P.bi : P.ai;

    var options = [correct];
    var used = {}; used['$' + correct.toLowerCase()] = true;
    var tries = 0, maxTries = wanted * 60;
    while (options.length < wanted && tries < maxTries) {
      tries++;
      var k = randInt(pairs.length), Q = pairs[k];
      if (flip ? Q.ai : Q.bi) { continue; }         // answers are always text
      var q = flip ? Q.b : Q.a;
      var c = flip ? Q.a : Q.b;
      var key = '$' + c.toLowerCase();
      if (used[key] || q === prompt) { continue; }   // no duplicates, no second "correct" answer
      used[key] = true;
      options.push(c);
    }
    shuffle(options);
    round = { correct: correct, hadWrong: false };

    showPrompt(prompt, promptIsImg, P.dir);
    var box = $('answers');
    box.innerHTML = '';
    for (var i = 0; i < options.length; i++) { box.appendChild(makeButton(options[i], i)); }
    setStatus('Pick the translation.');
  }

  function makeButton(text, index) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ans';
    setText(b, (index < 9 ? index + 1 : 0) + '. ' + text);     // keys 1-9, the 10th answer is key 0
    on(b, 'click', function () {
      if (locked || hasClass(b, 'wrong')) { return; }
      if (text === round.correct) {
        addClass(b, 'right');
        locked = true;
        if (!round.hadWrong) { score.ok++; }
        renderScore();
        playSound('correct');
        afterCorrect();
      } else {
        addClass(b, 'wrong');
        if (!round.hadWrong) { round.hadWrong = true; score.bad++; renderScore(); }
        playSound('wrong');
      }
    });
    return b;
  }

  function afterCorrect() {
    if ($('nextMode').value === 'manual') {
      setStatus('Correct!');
      delClass($('nextBtn'), 'hidden');
      try { $('nextBtn').focus(); } catch (e) { }
      return;
    }
    var left = delaySeconds();
    setStatus('Correct! Next word in {n}...', { n: left });
    tickTimer = setInterval(function () {
      left--;
      if (left <= 0) { newRound(); }
      else { setStatus('Correct! Next word in {n}...', { n: left }); }
    }, 1000);
  }

  /* ---------- ad (start screen only; picked at random every time the start screen is shown) ----------
     An entry with image data shows the banner; an entry without it shows a plain text link. */
  function hostOf(url) { var m = /^https?:\/\/([^\/?#]+)/i.exec(url || ''); return m ? m[1] : url; }
  function refreshAd() {
    var box = $('adBox');
    if (!ADS.length) { addClass(box, 'hidden'); return; }
    var idx = randInt(ADS.length);
    if (ADS.length > 1 && idx === lastAd) { idx = (idx + 1 + randInt(ADS.length - 1)) % ADS.length; }
    lastAd = idx;
    currentAd = ADS[idx];
    var link = $('adLink'), img = $('adImg'), txt = $('adText');
    if (currentAd.data && !NOIMAGE) {
      img.src = 'data:' + currentAd.mime + ';base64,' + currentAd.data;   // image lives inside the app
      img.alt = currentAd.alt || '';
      addClass(link, 'img'); delClass(img, 'hidden'); addClass(txt, 'hidden');
    } else {
      setText(txt, currentAd.alt || hostOf(currentAd.url));
      delClass(link, 'img'); addClass(img, 'hidden'); delClass(txt, 'hidden');
    }
    link.href = currentAd.url;
    renderAdText();
    delClass(box, 'hidden');
  }
  function renderAdText() { setText($('adLabel'), t('Ad')); }
  function hideAd() { addClass($('adBox'), 'hidden'); }

  /* The ad link can be opened, but is not offered for copying: no context menu, no dragging, no selection. */
  (function wireAd() {
    var a = $('adLink');
    on(a, 'contextmenu', stopEvent);
    on(a, 'dragstart', stopEvent);
    on(a, 'selectstart', stopEvent);
  })();

  /* ---------- About screen ---------- */
  function renderAbout() {
    if (!ABOUT) {
      addClass($('aboutIcon'), 'hidden');
      setText($('aboutVersion'), t('About data (about.js) was not found next to this page.'));
      setText($('aboutAuthor'), '');
      $('aboutLinks').innerHTML = '';
      return;
    }
    var icon = $('aboutIcon');
    if (ABOUT.icon && !NOIMAGE) { icon.src = ABOUT.icon; delClass(icon, 'hidden'); } else { addClass(icon, 'hidden'); }
    setText($('aboutVersion'), t('Version {v}', { v: ABOUT.version }));
    setText($('aboutAuthor'), ABOUT.author ? t(ABOUT.author) : '');
    var box = $('aboutLinks');
    box.innerHTML = '';
    var items = ABOUT.links || [], list = null;
    function newList(parent) { list = document.createElement('ul'); parent.appendChild(list); }
    newList(box);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.heading) {
        var det = document.createElement('details');
        var sm = document.createElement('summary');
        setText(sm, t(it.heading));
        det.appendChild(sm); box.appendChild(det);
        newList(det);
        continue;
      }
      var li = document.createElement('li'), holder = li, label = t(it.text);
      if (it.copy) {
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'linklike';
        btn.setAttribute('data-copy', it.copy);
        li.appendChild(btn); holder = btn;
      } else if (it.url) {
        var link = document.createElement('a');
        link.href = it.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
        li.appendChild(link); holder = link;
      } else if (/^Tap /.test(it.text)) {
        li.className = 'aboutNote';
      }
      if (it.icon && !NOIMAGE) {
        var im = document.createElement('img');
        im.alt = ''; im.className = 'siteIcon'; im.draggable = false;
        im.onerror = function () { this.style.display = 'none'; };
        im.src = it.icon;
        holder.appendChild(im);
      }
      holder.appendChild(document.createTextNode(label));
      list.appendChild(li);
    }
  }

  /* About links CAN be copied: long press (touch) copies at once; a mouse context menu offers "Copy link". */
  var lastCopy = 0, lastTouch = 0, pressTimer = null, pressFired = false, ctxUrl = '';
  function linkOf(el) { while (el && el.nodeName !== 'A') { el = el.parentNode; } return el; }
  function copyLink(url) {
    var now = new Date().getTime();
    if (now - lastCopy < 1000) { return; }
    lastCopy = now;
    copyText(url, function (ok) { showToast(ok ? 'Link copied' : 'Could not copy the link'); });
  }
  function cancelPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
  function hideCtx() { addClass($('ctxMenu'), 'hidden'); }
  (function wireAboutLinks() {
    var ul = $('aboutLinks');
    on(ul, 'touchstart', function (e) {
      lastTouch = new Date().getTime();
      var a = linkOf(e.target || e.srcElement); if (!a) { return; }
      cancelPress(); pressFired = false;
      pressTimer = setTimeout(function () { pressTimer = null; pressFired = true; copyLink(a.href); }, LONG_PRESS_MS);
    });
    on(ul, 'touchend', cancelPress);
    on(ul, 'touchmove', cancelPress);
    on(ul, 'touchcancel', cancelPress);
    on(ul, 'click', function (e) {
      if (pressFired) { pressFired = false; stopEvent(e); }      // a long press copies, it does not open
    });
    on(ul, 'contextmenu', function (e) {
      var a = linkOf(e.target || e.srcElement); if (!a) { return; }
      stopEvent(e);
      if (new Date().getTime() - lastTouch < 1500) { copyLink(a.href); return; }   // touch long press
      ctxUrl = a.href;
      var m = $('ctxMenu');
      delClass(m, 'hidden');
      m.style.left = Math.min(e.clientX, Math.max(0, window.innerWidth - 170)) + 'px';
      m.style.top = Math.min(e.clientY, Math.max(0, window.innerHeight - 50)) + 'px';
    });
    on($('ctxCopy'), 'click', function () { hideCtx(); copyLink(ctxUrl); });
    on(ul, 'click', function (e) {
      var el = e.target || e.srcElement;
      while (el && el !== ul && !(el.getAttribute && el.getAttribute('data-copy'))) { el = el.parentNode; }
      if (el && el !== ul) { copyText(el.getAttribute('data-copy'), function (ok) { showToast(ok ? 'Copied' : 'Could not copy the link'); }); }
    });
    on(document, 'click', function (e) { if (!linkOf(e.target || e.srcElement) && (e.target || e.srcElement) !== $('ctxCopy')) { hideCtx(); } });
    on(document, 'keydown', function (e) { if ((e.key || e.keyCode) === 'Escape' || e.keyCode === 27) { hideCtx(); } });
    on(window, 'scroll', hideCtx);
  })();

  /* ---------- screens ---------- */
  function showScreen(name) {
    var names = ['menu', 'about', 'game'];
    for (var i = 0; i < names.length; i++) {
      if (names[i] === name) { delClass($(names[i]), 'hidden'); } else { addClass($(names[i]), 'hidden'); }
    }
    hideCtx();
  }
  function showMenu() {
    stopTimer(); locked = false;
    showScreen('menu');
    refreshAd();                                     // new random ad every time the start screen appears
    renderScore();
  }
  function showAbout() { stopTimer(); showScreen('about'); hideAd(); renderAbout(); }
  function showGame() {
    score = { ok: 0, bad: 0 };
    showScreen('game'); hideAd();
    renderScore();
    newRound();
  }
  function doExit() {
    try { if (window.MWTAndroid && window.MWTAndroid.exit) { window.MWTAndroid.exit(); return; } } catch (e0) { }   // Android app (MainActivity bridge)
    try {
      var C = window.Capacitor;
      if (C && C.Plugins && C.Plugins.App && C.Plugins.App.exitApp) { C.Plugins.App.exitApp(); return; }
      if (C && C.nativePromise) { C.nativePromise('App', 'exitApp', {}); return; }
    } catch (e) { }
    try { window.close(); } catch (e2) { }                                                                         // Electron, NW.js
  }
  function exitApp() {
    stopTimer();
    var wait = ($('soundOpt').checked && SOUNDS.exit) ? 350 : 0;   // let the exit sound play
    playSound('exit');
    setTimeout(doExit, wait);
  }

  /* ---------- wiring ---------- */
  function pickedFiles(input) {
    var l = input.files;
    if (l && l.length) { handleFiles(l); }
    try { input.value = ''; } catch (e) { }          // allows choosing the same files again
  }
  on($('file'), 'change', function () { pickedFiles($('file')); });
  on($('folder'), 'change', function () { pickedFiles($('folder')); });
  on($('builtinBtn'), 'click', function () {
    playSound('builtin');
    if (typeof BUILTIN_DICTIONARY === 'string') {
      resetImages();
      var parsed = parseText(BUILTIN_DICTIONARY, '');
      pairs = parsed;
      $('startBtn').disabled = parsed.length < 2;
      fileState = { key: 'Built-in RU ↔ EN dictionary', params: null, raw: null };
      renderFile();
      setMessage('Loaded {n} entries. Choose options and press Start.', { n: parsed.length }, false);
    } else {
      setMessage('Built-in dictionary (dictionary.js) was not found next to this page.', null, true);
    }
  });
  on($('startBtn'), 'click', function () { if (pairs.length > 1) { playSound('start'); showGame(); } });
  on($('aboutBtn'), 'click', showAbout);
  on($('backBtn'), 'click', showMenu);
  on($('exitBtn'), 'click', exitApp);
  on($('toMenuBtn'), 'click', function () { playSound('menu'); showMenu(); });
  on($('nextBtn'), 'click', function () { if (locked) { newRound(); } });
  on($('lang'), 'change', function () {
    if ($('lang').value === '__remove__') {
      imported = []; saveImported(); saveSetting('lang', 'auto');
      rebuildLangList(); buildLangMenu('auto'); applyLang();
      showToast('Imported languages removed.');
      return;
    }
    saveSetting('lang', $('lang').value); applyLang();
  });
  on($('langFile'), 'change', function () {
    var l = $('langFile').files;
    if (l && l.length) { importLangFiles(l); }
    try { $('langFile').value = ''; } catch (e) { }
  });
  on($('theme'), 'change', function () { saveSetting('theme', $('theme').value); applyTheme(); });
  on($('scoreOpt'), 'change', function () { saveSetting('score', $('scoreOpt').checked ? '1' : '0'); renderScore(); });
  on($('soundOpt'), 'change', function () { saveSetting('sound', $('soundOpt').checked ? '1' : '0'); });
  on($('count'), 'change', function () { saveSetting('count', $('count').value); });
  on($('dir'), 'change', function () { saveSetting('dir', $('dir').value); });
  function syncNextMode() { if ($('nextMode').value === 'manual') { addClass($('delayWrap'), 'hidden'); } else { delClass($('delayWrap'), 'hidden'); } }
  on($('nextMode'), 'change', function () { saveSetting('nextMode', $('nextMode').value); syncNextMode(); });
  on($('delay'), 'change', function () { $('delay').value = delaySeconds(); saveSetting('delay', $('delay').value); });
  if (mq) {
    if (mq.addEventListener) { mq.addEventListener('change', applyTheme); }
    else if (mq.addListener) { mq.addListener(applyTheme); }
  }

  /* Coming back to the app (Android: minimised -> opened again; also a browser tab becoming visible)
     rolls a new random ad, but only while the start screen is showing. */
  var wasHidden = false, lastResume = 0;
  function onResume() {
    var now = new Date().getTime();
    if (now - lastResume < 500) { return; }
    lastResume = now;
    if (!hasClass($('menu'), 'hidden')) { refreshAd(); }
  }
  on(document, 'visibilitychange', function () {
    if (document.visibilityState === 'hidden') { wasHidden = true; }
    else if (wasHidden) { wasHidden = false; onResume(); }
  });
  on(document, 'resume', onResume);                  // Capacitor/Cordova style resume event

  /* ---------- keyboard ----------
     Digits 1-9 / 0 pick an answer. Arrow keys move focus like Tab, but a closed <select> keeps its own
     arrow behaviour (they change the value) until the first/last option is reached; then focus moves on. */
  var FOCUSABLE = 'button, select, input[type=checkbox], input[type=number], label.btn, a[href], summary';
  function moveFocus(from, dir) {
    var all = document.querySelectorAll(FOCUSABLE), list = [], cur = -1;
    for (var i = 0; i < all.length; i++) {
      var x = all[i];
      if (!(x.offsetWidth || x.offsetHeight) || x.disabled) { continue; }
      if (x === from) { cur = list.length; }
      list.push(x);
    }
    if (!list.length) { return false; }
    var n = cur < 0 ? (dir > 0 ? 0 : list.length - 1) : cur + dir;
    if (n < 0 || n >= list.length) { return false; }
    list[n].focus();
    return true;
  }
  on(document, 'keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) { return; }          // never hijack browser/app shortcuts
    var key = e.key || '', el = e.target || e.srcElement, tag = (el && el.nodeName) || '';
    if (/^[0-9]$/.test(key) && !hasClass($('game'), 'hidden') && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      var btns = $('answers').getElementsByTagName('button'), i = key === '0' ? 9 : parseInt(key, 10) - 1;
      if (btns[i]) { stopEvent(e); btns[i].click(); }
      return;
    }
    if ((key === 'Enter' || key === ' ') && tag === 'LABEL' && el.getAttribute('for') && $(el.getAttribute('for'))) {
      stopEvent(e); $(el.getAttribute('for')).click(); return;    // keyboard use of the Browse / Folder buttons
    }
    if (e.shiftKey) { return; }
    var dir = (key === 'ArrowDown' || key === 'ArrowRight' || key === 'Down' || key === 'Right') ? 1 :
              (key === 'ArrowUp' || key === 'ArrowLeft' || key === 'Up' || key === 'Left') ? -1 : 0;
    if (!dir || tag === 'TEXTAREA' || (tag === 'INPUT' && el.type === 'number')) { return; }
    if (tag === 'SELECT') {
      var atEdge = dir > 0 ? el.selectedIndex >= el.options.length - 1 : el.selectedIndex <= 0;
      if (!atEdge) { return; }                                  // let the list scroll through its values
    }
    if (moveFocus(el, dir)) { stopEvent(e); }
  });

  /* ---------- command-line options ---------- */
  function swallowKey(e) {
    if (e.ctrlKey || e.altKey || e.metaKey) { return; }
    var k = e.key || '';
    if (/^F([1-9]|1[0-2])$/.test(k) || k === 'Escape') { return; }
    e.preventDefault(); e.stopPropagation();
    if (e.stopImmediatePropagation) { e.stopImmediatePropagation(); }
  }
  function applyCliLook() {
    if (!CLI) { return; }
    if (CLI.font && /^[^"'\\;{}<>]{1,80}$/.test(CLI.font)) {
      document.body.style.fontFamily = '"' + CLI.font + '", Arial, Helvetica, sans-serif';
    }
    if (CLI.nokeyboard) {
      var types = ['keydown', 'keyup', 'keypress'];
      for (var i = 0; i < types.length; i++) { window.addEventListener(types[i], swallowKey, true); }
    }
    if (CLI.nomouse) {
      addClass(document.documentElement, 'nomouse');
      window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
      window.addEventListener('wheel', function (e) { e.preventDefault(); }, { capture: true, passive: false });
    }
  }
  function addSessionLangs() {
    if (!CLI || !CLI.langText) { return; }
    try { sessionLangs = langsFromData(JSON.parse(String(CLI.langText).replace(/^\\uFEFF/, ''))); }
    catch (e) { sessionLangs = []; }
    if (!sessionLangs.length) { console.warn('--lang: the file has no usable language data'); }
  }
  function selectCliLang() {
    if (!CLI) { return; }
    var id = null;
    if (sessionLangs.length) { id = sessionLangs[0].id; }
    else if (CLI.lang) {
      var tag = String(CLI.lang).toLowerCase().replace('_', '-');
      id = findLang(tag) || findLang(tag.split('-')[0]);
      if (!id) { console.warn('--lang: no language "' + CLI.lang + '" is available (import a language file, or use --lang FILE)'); }
    }
    if (id && LANGBY[id]) { $('lang').value = id; }
  }
  function openCliFiles() {
    if (!CLI || !CLI.hasOpen || !CLI.getFiles) { return; }
    CLI.getFiles().then(function (list) {
      var files = [];
      for (var i = 0; i < list.length; i++) {
        try {
          var f = new File([list[i].data], list[i].name);
          Object.defineProperty(f, 'webkitRelativePath', { value: list[i].rel || list[i].name });
          files.push(f);
        } catch (e) { }
      }
      console.info('--open: ' + files.length + ' file(s) received');
      if (files.length) { handleFiles(files); }
      else { setMessage('No dictionary file (.txt, .xlsx, .xls, .ods) among the selected files.', null, true); }
    }, function (err) { console.warn('--open failed: ' + err); });
  }

  /* ---------- init ---------- */
  function initSettings() {
    var v;
    if ((v = loadSetting('count'))) { $('count').value = v; }
    if ((v = loadSetting('dir'))) { $('dir').value = v; }
    if ((v = loadSetting('nextMode'))) { $('nextMode').value = v; }
    if ((v = loadSetting('delay'))) { $('delay').value = v; }
    $('scoreOpt').checked = loadSetting('score') === '1';
    if (loadSetting('sound') === '0') { $('soundOpt').checked = false; }
    syncNextMode();
    if (!hasSounds()) { addClass($('soundRow'), 'hidden'); }
    if (isStandalone()) { delClass($('exitBtn'), 'hidden'); }
    var lbls = document.querySelectorAll('label.btn');
    for (var li = 0; li < lbls.length; li++) { lbls[li].setAttribute('tabindex', '0'); }
    var probe = document.createElement('input');
    if (!('webkitdirectory' in probe)) { addClass($('folderBtn'), 'hidden'); }
  }
  loadImported();
  addSessionLangs();
  rebuildLangList();
  buildLangMenu();
  selectCliLang();
  var savedTheme = loadSetting('theme');
  $('theme').value = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'auto';
  initSettings();
  applyTheme();
  applyCliLook();
  applyLang();
  refreshAd();
  if (CLI && CLI.initialOpen) { openCliFiles(); }
  if (CLI && CLI.onFiles) { CLI.onFiles(openCliFiles); }
})();
</script>
</body>
</html>
