<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#1f1e1d;color:#f0eee6;text-align:center}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .big{font-size:40px;font-weight:bold;color:#d97757;margin:8px 0}
  .tr{font-size:28px;margin:4px 0 24px}
  .small{font-size:12px;color:#a8a69c}
</style></head>
<body>
  <div style="font-size:56px">&#128275;</div>
  <div class="small">Oh, you found the secret page!</div>
  <div class="big" id="w"></div>
  <div class="tr" id="t"></div>
  <div class="small">io.github.monowordtest.SecretActivity</div>
  <script src="dictionary.js" charset="utf-8"></script>
  <script>
    (function () {
      var lines = String(typeof BUILTIN_DICTIONARY === 'string' ? BUILTIN_DICTIONARY : '').split('\n'), pairs = [];
      for (var i = 0; i < lines.length; i++) { var p = lines[i].indexOf(' - '); if (p > 0) { pairs.push([lines[i].slice(0, p), lines[i].slice(p + 3)]); } }
      if (!pairs.length) { return; }
      var day = Math.floor(new Date().getTime() / 86400000);          // same word all day long
      var pick = pairs[(day * 7919) % pairs.length];
      document.getElementById('w').textContent = pick[0];
      document.getElementById('t').textContent = pick[1];
    })();
  </script>
</body></html>
