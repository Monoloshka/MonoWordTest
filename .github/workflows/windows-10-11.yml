name: Build Windows 10/11 (portable .exe)

# Own button: Actions tab -> "Build Windows 10/11 (portable .exe)" -> Run workflow.
# The same file is also used by "Build packages" (all formats at once, tags -> GitHub Release).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  win-modern:
    name: Windows 10/11 portable .exe (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
        shell: bash
      - run: npx electron-builder --win portable --${{ matrix.arch }} --publish never
        shell: bash
      - uses: actions/upload-artifact@v7
        with: { retention-days: 3, name: 'MonoWordTest-win10-11-${{ matrix.arch }}', path: 'dist/MonoWordTest-*.exe' }
