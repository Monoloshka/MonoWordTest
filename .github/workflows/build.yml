name: Build packages

# Builds every format at once. Each format also has its own workflow with its own "Run workflow" button
# (web.yml, windows-*.yml, macos.yml, linux*.yml, openwrt.yml, android.yml, flatpak.yml, ios.yml), so a slow or failing format
# (for example macOS runners that are busy) can be run again alone.
# Run manually (Actions tab -> "Build packages" -> Run workflow) or push a tag like v1.0.0
# to build everything and attach it to a GitHub Release. Keep "version" in package.json in sync with the tag.
# Flatpak and iOS are manual-only (flatpak.yml, ios.yml) and are not part of this run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web:
    uses: ./.github/workflows/web.yml
  win-modern:
    uses: ./.github/workflows/windows-10-11.yml
  win-legacy:
    uses: ./.github/workflows/windows-7-8.yml
  win-msi:
    uses: ./.github/workflows/windows-msi.yml
  win-xp:
    uses: ./.github/workflows/windows-xp-vista.yml
  macos:
    uses: ./.github/workflows/macos.yml
  linux:
    uses: ./.github/workflows/linux.yml
  linux-snap:
    uses: ./.github/workflows/linux-snap.yml
  openwrt:
    uses: ./.github/workflows/openwrt.yml
  android:
    uses: ./.github/workflows/android.yml

  # ---------------------------------------------------------------- GitHub Release (tags only)
  release:
    name: Attach everything to the GitHub Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [web, win-modern, win-legacy, win-msi, win-xp, macos, linux, linux-snap, openwrt, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: MonoWordTest-*
          merge-multiple: true
          path: release
      - run: ls -la release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
