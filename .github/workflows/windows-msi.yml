name: Build Windows MSI

# Own button: Actions tab -> "Build Windows MSI" -> Run workflow.
# The same file is also used by "Build packages" (all formats at once, tags -> GitHub Release).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  win-msi:
    name: Windows .msi (x64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win msi --x64 --publish never
      - uses: actions/upload-artifact@v7
        with: { retention-days: 3, name: MonoWordTest-win-msi, path: 'dist/MonoWordTest-*.msi' }
